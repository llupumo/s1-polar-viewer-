<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel-1 EW · North Polar Stereographic</title>
<style>
  :root { --bg:#0e1a24; --panel:#14232f; --line:#2a3f50; --ink:#dce8f0; --dim:#8aa2b4; --accent:#6fd0e8; }
  * { box-sizing: border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { display:flex; }
  aside { width:310px; flex:none; background:var(--panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:14px; gap:12px; overflow:hidden; }
  h1 { font:600 16px/1.3 Georgia, serif; margin:0; }
  h1 small { display:block; font:12px "Segoe UI", sans-serif; color:var(--dim); margin-top:2px; }
  label { display:flex; align-items:center; gap:8px; }
  select, input[type=range] { width:100%; }
  select { background:var(--bg); color:var(--ink); border:1px solid var(--line); padding:6px; border-radius:4px; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; }
  button { background:none; color:var(--accent); border:1px solid var(--line); border-radius:4px; padding:4px 8px; cursor:pointer; }
  button:hover, button:focus-visible { border-color:var(--accent); outline:none; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  input[type=number], input[type=date] { background:var(--bg); color:var(--ink); border:1px solid var(--line);
    padding:5px 6px; border-radius:4px; width:100%; min-width:0; color-scheme:dark; font:inherit; }
  .nav { display:flex; gap:6px; align-items:center; }
  .nav button { padding:5px 11px; font-size:15px; line-height:1; }
  button:disabled { opacity:.35; cursor:default; border-color:var(--line); }
  #range { font-weight:600; }
  #range small { display:block; font-weight:400; color:var(--dim); font-size:12px; }
  .dh { color:var(--accent); font-size:12px; margin-top:4px; letter-spacing:.02em; }
  #scenes { overflow:auto; flex:1; border-top:1px solid var(--line); padding-top:8px; display:flex; flex-direction:column; gap:6px; }
  #scenes span { color:var(--dim); font-size:12px; margin-left:auto; }
  #map { flex:1; position:relative; min-width:0; }
  #cv { position:absolute; inset:0; width:100%; height:100%; cursor:grab; touch-action:none; }
  #cv:active { cursor:grabbing; }
  #coord { position:absolute; left:10px; bottom:10px; background:rgba(14,26,36,.85); padding:5px 9px;
    border:1px solid var(--line); border-radius:4px; font:12px ui-monospace, Menlo, monospace; pointer-events:none; }
  #landnote, #msg, #hint { color:var(--dim); font-size:12px; }
  @media (max-width:700px){ body{flex-direction:column} aside{width:100%;max-height:45%} }
</style>
</head>
<body>
<aside>
  <h1>Sentinel-1 EW GRDM<small>North polar stereographic (EPSG:3413)</small></h1>
  <div class="grid">
    <label title="Length of the period">Days <input id="n" type="number" min="1" max="60" value="1"></label>
    <label title="How many days the arrows move">Step <input id="step" type="number" min="1" max="60" value="1"></label>
  </div>
  <div class="nav">
    <button id="prev" title="Previous period (←)" aria-label="Previous period">◀</button>
    <input id="start" type="date" aria-label="First day of period">
    <button id="next" title="Next period (→)" aria-label="Next period">▶</button>
  </div>
  <div id="range"></div>
  <label>Opacity <input id="op" type="range" min="0" max="1" step="0.05" value="1"></label>
  <div class="row"><label><input id="land" type="checkbox" checked disabled> Land</label><span id="landnote"></span></div>
  <div class="row">
    <label><input id="grat" type="checkbox" checked> Graticule</label>
    <span><button id="all">All</button> <button id="none">None</button> <button id="fit" title="Zoom to the scenes shown">Fit</button></span>
  </div>
  <div id="scenes"></div>
  <div id="msg">Loading…</div>
  <div id="hint">Drag to pan, scroll to zoom, double-click a scene to zoom to it. ← → keys change period.</div>
</aside>
<div id="map"><canvas id="cv"></canvas><div id="coord">Move over the map</div></div>

<script>
const $ = id => document.getElementById(id);
const fail = m => { $('msg').style.color = '#ff9a8a'; $('msg').textContent = m; console.error(m); };
window.onerror = (m, s, l) => fail(`Script error: ${m} (line ${l})`);

// --- EPSG:3413 maths (WGS84, lat_ts 70°N, lon_0 -45°) ---
const D = Math.PI / 180, A = 6378137, E = Math.sqrt(0.00669437999014), L0 = -45 * D, LC = 70 * D;
const tf = p => Math.tan(Math.PI / 4 - p / 2) / Math.pow((1 - E * Math.sin(p)) / (1 + E * Math.sin(p)), E / 2);
const MC = Math.cos(LC) / Math.sqrt(1 - E * E * Math.sin(LC) ** 2);
const rhoOf = latDeg => A * MC * tf(latDeg * D) / tf(LC);          // radius from pole, metres
function latOf(r) {
  const t = r * tf(LC) / (A * MC); let p = Math.PI / 2 - 2 * Math.atan(t);
  for (let i = 0; i < 6; i++) { const s = Math.sin(p); p = Math.PI / 2 - 2 * Math.atan(t * Math.pow((1 - E * s) / (1 + E * s), E / 2)); }
  return p / D;
}

// --- view state ---
const cv = $('cv'), ctx = cv.getContext('2d');
let land = null, showLand = true, W = 1, H = 1, cx = 0, cy = 0, sc = 8000, cur = [], scenes = [], showGrat = true;
const X = x => (x - cx) / sc + W / 2, Y = y => H / 2 - (y - cy) / sc;

function resize() {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); draw();
}
new ResizeObserver(resize).observe(cv);

let queued = false;
function draw() { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; paint(); }); } }

function paint() {
  ctx.fillStyle = '#0e1a24'; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  const op = +$('op').value;
  let lp = null;
  if (land && showLand) {
    lp = new Path2D();
    for (const [xs, ys] of land) {
      lp.moveTo(X(xs[0]), Y(ys[0]));
      for (let i = 1; i < xs.length; i++) lp.lineTo(X(xs[i]), Y(ys[i]));
      lp.closePath();
    }
    ctx.fillStyle = '#24394a'; ctx.fill(lp, 'evenodd');
  }
  for (const o of cur) {
    if (!o.on || !o.img.complete || !o.img.naturalWidth) continue;
    const [x0, y0, x1, y1] = o.s.extent;
    ctx.globalAlpha = op;
    ctx.drawImage(o.img, X(x0), Y(y1), (x1 - x0) / sc, (y1 - y0) / sc);
  }
  ctx.globalAlpha = 1;
  if (lp) { ctx.strokeStyle = '#e0cf8f'; ctx.lineWidth = 1; ctx.stroke(lp); }
  if (showGrat) graticule();
}

function graticule() {
  ctx.strokeStyle = 'rgba(160,210,230,.35)'; ctx.lineWidth = 1;
  ctx.fillStyle = '#8aa2b4'; ctx.font = '11px sans-serif';
  const ox = X(0), oy = Y(0), pt = (r, lon) => [ox + r / sc * Math.sin((lon + 45) * D), oy + r / sc * Math.cos((lon + 45) * D)];
  for (let lat = 50; lat <= 85; lat += 5) {
    const r = rhoOf(lat); ctx.beginPath(); ctx.arc(ox, oy, r / sc, 0, 2 * Math.PI); ctx.stroke();
    const [lx, ly] = pt(r, 0); if (lx > 0 && lx < W && ly > 0 && ly < H) ctx.fillText(lat + '°N', lx + 3, ly - 3);
  }
  for (let lon = -180; lon < 180; lon += 30) {
    const [a, b] = pt(rhoOf(50), lon); ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(a, b); ctx.stroke();
    const [lx, ly] = pt(rhoOf(72), lon); if (lx > 0 && lx < W && ly > 0 && ly < H) ctx.fillText(lon + '°', lx + 3, ly - 3);
  }
}

function fit(e) {
  resize();
  sc = Math.max((e[2] - e[0]) / Math.max(1, W - 80), (e[3] - e[1]) / Math.max(1, H - 80));
  cx = (e[0] + e[2]) / 2; cy = (e[1] + e[3]) / 2; draw();
}

// --- interaction ---
let drag = null;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointerup', () => drag = null);
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  if (drag) { cx -= (e.clientX - drag.x) * sc; cy += (e.clientY - drag.y) * sc; drag = { x: e.clientX, y: e.clientY }; draw(); }
  const x = (px - W / 2) * sc + cx, y = (H / 2 - py) * sc + cy;
  let lon = Math.atan2(x, -y) / D + L0 / D; lon = ((lon + 540) % 360) - 180;
  $('coord').textContent = `${latOf(Math.hypot(x, y)).toFixed(3)}°N  ${lon.toFixed(3)}°E  |  x ${x.toFixed(0)} y ${y.toFixed(0)} m`;
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const x = (px - W / 2) * sc + cx, y = (H / 2 - py) * sc + cy;
  sc = Math.min(40000, Math.max(20, sc * Math.exp(e.deltaY * 0.0015)));
  cx = x - (px - W / 2) * sc; cy = y + (py - H / 2) * sc; draw();
}, { passive: false });

// --- data & periods ---
const hhmm = s => s.slice(11, 16);
const dn = d => Date.parse(d + 'T00:00:00Z') / 864e5;                 // ISO date -> day number
const iso = n => new Date(n * 864e5).toISOString().slice(0, 10);
const nice = n => new Date(n * 864e5).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const imgs = new Map(), hidden = new Set();
let dMin = 0, dMax = 0, startDay = 0;
const num = id => Math.max(1, Math.min(60, Math.round(+$(id).value) || 1));
const lastStart = () => Math.max(dMin, dMax - num('n') + 1);
const union = ex => ex.reduce((a, b) => [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])]);

function getImg(s) {
  let img = imgs.get(s.file);
  if (!img) {
    img = new Image(); img.onload = draw;
    img.onerror = () => fail('Could not load ' + s.file + ' — is it in site/data/?');
    img.src = s.file; imgs.set(s.file, img);
  }
  return img;
}

function setStart(d, refit) {
  startDay = Math.max(dMin, Math.min(d, lastStart()));
  const n = num('n'), a = startDay, b = a + n - 1;
  $('start').min = iso(dMin); $('start').max = iso(lastStart()); $('start').value = iso(a);
  $('prev').disabled = a <= dMin; $('next').disabled = a >= lastStart();
  const sel = scenes.filter(s => s.day >= a && s.day <= b);
  const keep = new Set(sel.map(s => s.file));
  for (const k of imgs.keys()) if (!keep.has(k)) imgs.delete(k);           // free memory for scenes that left the window
  $('range').innerHTML = (n === 1 ? nice(a) : `${nice(a)} – ${nice(b)}`) +
    `<small>${sel.length ? sel.length + ' scene' + (sel.length > 1 ? 's' : '') : 'no scenes in this period'}</small>`;
  const list = $('scenes'); list.innerHTML = ''; let lastDay = null;
  cur = sel.map(s => {
    if (s.day !== lastDay) { lastDay = s.day; const h = document.createElement('div'); h.className = 'dh'; h.textContent = nice(s.day); list.appendChild(h); }
    const o = { s, img: getImg(s), on: !hidden.has(s.file) };
    const row = document.createElement('label');
    row.innerHTML = `<input type="checkbox" ${o.on ? 'checked' : ''}> ${hhmm(s.start)}–${hhmm(s.end)} <span>${s.sat} · ${s.pol}</span>`;
    row.firstChild.onchange = e => { o.on = e.target.checked; e.target.checked ? hidden.delete(s.file) : hidden.add(s.file); draw(); };
    row.ondblclick = () => fit(s.extent);
    list.appendChild(row);
    return o;
  });
  if (refit) fitShown(); else draw();
}
function fitShown() {
  const src = cur.length ? cur.map(o => o.s) : scenes;
  if (src.length) fit(union(src.map(s => s.extent)));
}
function setAll(v) {
  document.querySelectorAll('#scenes input').forEach((c, i) => { c.checked = v; cur[i].on = v; v ? hidden.delete(cur[i].s.file) : hidden.add(cur[i].s.file); });
  draw();
}
$('n').onchange = () => { $('n').value = num('n'); setStart(startDay); };
$('step').onchange = () => { $('step').value = num('step'); };
$('prev').onclick = () => setStart(startDay - num('step'));
$('next').onclick = () => setStart(startDay + num('step'));
$('start').onchange = e => { if (e.target.value) setStart(dn(e.target.value)); };
$('fit').onclick = fitShown;
window.addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) && e.target.type !== 'checkbox') return;
  if (e.key === 'ArrowLeft') $('prev').click(); else if (e.key === 'ArrowRight') $('next').click();
});

$('land').onchange = e => { showLand = e.target.checked; draw(); };
fetch('data/land.json').then(r => { if (!r.ok) throw 0; return r.json(); }).then(d => {
  land = d.rings.map(f => {
    const n = f.length / 2, xs = new Float64Array(n), ys = new Float64Array(n);
    for (let i = 0; i < n; i++) { const r = rhoOf(f[2 * i + 1]), t = (f[2 * i] + 45) * D; xs[i] = r * Math.sin(t); ys[i] = -r * Math.cos(t); }
    return [xs, ys];
  });
  $('land').disabled = false; draw();
}).catch(() => { $('landnote').textContent = 'no data/land.json yet — run fetch_land.py'; });
$('op').oninput = draw;
$('grat').onchange = e => { showGrat = e.target.checked; draw(); };
$('all').onclick = () => setAll(true);
$('none').onclick = () => setAll(false);

fetch('data/index.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(data => {
  scenes = data;
  if (!scenes.length) return fail('index.json is empty — the build script found no scenes.');
  scenes.forEach(s => s.day = dn(s.start.slice(0, 10)));
  dMin = Math.min(...scenes.map(s => s.day)); dMax = Math.max(...scenes.map(s => s.day));
  $('msg').textContent = `${scenes.length} scenes · ${iso(dMin)} to ${iso(dMax)}`;
  setStart(dMin, true);
}).catch(e => fail('Could not load data/index.json (' + e.message + '). Serve the site/ folder with python -m http.server; do not open index.html directly.'));
resize();

</script>
</body>
</html>
